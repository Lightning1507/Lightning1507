name: Update public activity

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - tests/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check data handling
        run: python -m unittest discover -s tests -v
      - name: Fetch public contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py --username Lightning1507
      - name: Commit updated summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/activity.json
          git add -A assets
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public GitHub activity'
            git push
          fi
